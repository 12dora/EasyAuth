{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - EasyAuth</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bg-deep: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --faint: #64748b;
      --line: #e2e8f0;
      --brand: #0f172a;
      --brand-strong: #1e293b;
      --radius: 6px;
      --radius-tight: 2px;
      font-family: "Geist", "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1440px, 100%);
      height: 56px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 36px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .brand-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .brand-copy strong {
      overflow: hidden;
      font-size: 16px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy span {
      color: var(--faint);
      font-size: 12px;
    }

    .auth-main {
      display: grid;
      align-items: start;
      justify-items: center;
      width: min(960px, 100%);
      min-height: calc(100dvh - 57px);
      margin: 0 auto;
      padding: 72px 20px;
    }

    .card {
      display: grid;
      gap: 16px;
      width: min(400px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .card-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .card-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .button-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--brand);
      border-radius: var(--radius-tight);
      background: var(--brand);
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 150ms ease-out, border-color 150ms ease-out;
    }

    .button-primary:hover {
      border-color: var(--brand-strong);
      background: var(--brand-strong);
    }

    .button-primary:focus-visible,
    .aux a:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .aux {
      margin: 0;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.6;
    }

    .aux a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 640px) {
      .topbar-inner { padding: 0 16px; }
      .brand-copy span { display: none; }
      .auth-main { padding: 40px 16px 56px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/portal/" aria-label="EasyAuth 员工门户">
        <img class="brand-logo" src="{% static 'easyauth/frontend/assets/brand/jiefa_logo.webp' %}" alt="">
        <span class="brand-copy">
          <strong>EasyAuth</strong>
          <span>统一权限与授权门户</span>
        </span>
      </a>
    </div>
  </header>
  <main class="auth-main">
    <section class="card" aria-labelledby="sign-in-title">
      <div>
        <h1 class="card-title" id="sign-in-title">登录 EasyAuth</h1>
      </div>
      <p class="card-subtitle">使用你的工作账号继续。点击后将跳转到统一身份认证完成登录。</p>
      <a class="button-primary" href="{{ oidc_login_href }}">使用工作账号登录</a>
      <p class="aux">本地管理员应急登录请前往 <a href="/auth/local/">本地账号登录</a>。</p>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>身份检查</title></head>
<body>
{{ outcome|json_script:"identity-check-outcome" }}
{{ user_id|json_script:"identity-check-user-id" }}
<script>
window.parent.postMessage({type: "easyauth:identity-check", outcome: JSON.parse(document.getElementById("identity-check-outcome").textContent), user_id: JSON.parse(document.getElementById("identity-check-user-id").textContent)}, window.location.origin);
</script>
</body>
</html>

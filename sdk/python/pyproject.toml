[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "easyauth-app-sdk"
version = "0.3.0"
description = "EasyAuth 下游应用接入 SDK: 描述符、授权、目录、通知与审批客户端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.140,<0.141",
    "httpx>=0.28,<1",
    "httpx2>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

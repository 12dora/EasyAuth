# EasyAuth 公网反代部署(iam.jiefakj.com)。
#
# 容器化 web + celery worker + celery beat + dingtalk stream + 一个专用 redis。
# - worker/beat 是必备项, 不是可选增强: 缺了会静默丢失一整批特性——
#     · beat 调度的 dingtalk-directory-sync 是离职检出的信号源(目录同步 → 自动建交接单),
#       没有 beat, 离职/转岗自动化链路根本不会触发;
#     · grant-expiration-cleanup(限时授权到期回收)、dependency-health-check 也依赖 beat;
#     · worker 消费 webhook 投递(审批结果 approval.completed)、Authentik 离职禁号等异步任务;
#     · notify-worker 消费 notify 队列(钉钉工作通知投递, deliver_message), beat 调度的
#       notify-reconcile(60s 对账升级 sent→delivered)/notify-prune(日清理) 走默认队列由 worker 消费。
#   五者共用同一 easyauth-web:local 镜像与 broker(redis db0/1), 一起 up 才是完整部署。
# - stream 是钉钉 Stream 模式常驻消费进程(WebSocket 出站长连接, 无入站端口):
#   通讯录入离职/部门变更事件到达后触发目录快速同步(秒级), 审批实例事件实时推进审批状态;
#   它挂掉不丢事件——钉钉按 ACK 重投 + beat 的 5 分钟目录轮询仍是兜底。
# - 数据仍用仓库根的 db.sqlite3(挂载进容器), 以保留已注册的 easytrade 应用与静态 token、
#   Authentik 集成配置、用户等状态 —— 迁到 Postgres 会丢这些, 破坏 EasyTrade↔EasyAuth 联调。
#   web 与 worker 并发写同一 SQLite: 任务低频(目录同步 5min/授权清理 1min), 写锁竞争可接受,
#   属开发级部署。
# - 用 runserver(非 gunicorn): 仓库未装 whitenoise, gunicorn 下 SPA 静态资源不会被服务;
#   runserver + DEBUG=1 会自动服务 STATICFILES_DIRS。DEBUG=1 也是 SQLite 的前置(settings 禁止
#   生产用 SQLite)。
# - 端口发布在 127.0.0.1:8001, 保持 EasyTrade backend 经 host.docker.internal:8001 访问不变,
#   frpc 也反代到 127.0.0.1:8001。

# web / worker / beat 共用镜像与运行环境; 仅 command(与 web 的 ports)不同。
x-easyauth-common: &easyauth-common
  image: easyauth-web:local
  restart: unless-stopped
  env_file:
    - .env.local
  environment: &easyauth-env
    # 反代部署 settings: base + SECURE_PROXY_SSL_HEADER(避免 /auth/login/ 302 死循环)。
    DJANGO_SETTINGS_MODULE: "easyauth.config.settings.deploy"
    DJANGO_DEBUG: "1"
    DJANGO_ALLOWED_HOSTS: "iam.jiefakj.com,localhost,127.0.0.1,host.docker.internal"
    DJANGO_CSRF_TRUSTED_ORIGINS: "https://iam.jiefakj.com"
    EASYAUTH_CACHE_URL: "redis://redis:6379/2"
    # Celery broker/result 指向 compose 内的 redis 服务(db0=broker, db1=result);
    # 默认值是 localhost:6379, 在容器内连不到 redis —— 不覆盖则 web 连 enqueue 都会失败。
    CELERY_BROKER_URL: "redis://redis:6379/0"
    CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    # worker 进程内 HTTP /health 端口(仅绑 127.0.0.1); Compose 探针用 urllib 打这个端口,
    # 不再每次拉起 celery inspect ping.
    EASYAUTH_WORKER_HEALTH_PORT: "8002"
    EASYAUTH_HEALTH_REQUIRE_BACKGROUND: "1"
    # 容器内 localhost 不是宿主; Authentik 在宿主 :19000(worker 的目录同步/离职禁号也要用)。
    EASYAUTH_AUTHENTIK_BASE_URL: "http://host.docker.internal:19000"
    # 公网回调(需在 Authentik easyauth-portal provider 的 redirect URIs 里登记该地址,
    # 否则 OIDC 单点登录会 redirect_uri 不匹配; 本地超管登录不受影响)。
    EASYAUTH_AUTHENTIK_OIDC_REDIRECT_URI: "https://iam.jiefakj.com/auth/callback/"
    # WebAuthn RP ID/Origins 默认是 localhost, 在 iam.jiefakj.com 下注册/验证 passkey 会失败。
    # (改 RP ID 会使旧 RP 下已注册凭据失效; 当前 accounts_localadminpasskey 为空, 无影响。)
    EASYAUTH_WEBAUTHN_RP_ID: "iam.jiefakj.com"
    EASYAUTH_WEBAUTHN_ORIGINS: "https://iam.jiefakj.com"
    # 内网业务应用在容器内解析到 RFC1918; 仅对这些精确主机名放宽私网/共享地址 DNS 策略,
    # TLS 校验与连接钉扎仍使用原始主机名。禁止通配符与 IP 字面量。
    EASYAUTH_TRUSTED_WEBHOOK_HOSTS: "etrade.jiefakj.com,tradedata.jiefakj.com"
  volumes:
    - ./db.sqlite3:/app/db.sqlite3
    # 部署 settings 在镜像构建之后新增, 挂载进去省一次重建(重建时 COPY src/ 也会带上它)。
    - ./src/easyauth/config/settings/deploy.py:/app/src/easyauth/config/settings/deploy.py:ro
  extra_hosts:
    # worker 经此访问宿主 Authentik(:19000, 禁号)与 EasyTrade backend(:8000, 交接钩子投递)。
    - "host.docker.internal:host-gateway"
    # 宿主代理开 fake-ip DNS 时容器把公网域名解析到 198.18.0.0/15(保留段),
    # 会被 config.net 的 is_global SSRF 校验拦下; 固定解析到 frps 公网 IP 绕开。
    # eproject 公网 DNS 记录暂缺(浏览器访问需在 DNSPod 补 A 记录), frps/TLS 已就绪。
    - "auth.jiefakj.com:122.51.254.148"
    - "iam.jiefakj.com:122.51.254.148"
    - "etrade.jiefakj.com:122.51.254.148"
    - "eproject.jiefakj.com:122.51.254.148"
  depends_on:
    - redis
  networks: [easyauth]

# worker / webhook-worker / notify-worker 共用: 打进程内 127.0.0.1:8002/health
# (worker_ready 后起的 ThreadingHTTPServer). 探针只是一次 urllib, 不启动
# Python/Django/Celery 新进程、也不做 broker 广播; 原先 celery inspect ping
# 每次探针都冷启动完整进程, 空闲 worker 也会被打到 20–55% CPU.
# webhook-worker 入口脚本已放行 lo(-o lo ACCEPT), 环回探针不受出站防火墙影响.
x-worker-healthcheck: &worker-healthcheck
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)",
    ]
  interval: 30s
  timeout: 10s
  start_period: 20s
  retries: 3

services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    networks: [easyauth]

  web:
    <<: *easyauth-common
    build:
      context: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8001", "--noreload"]
    ports:
      - "127.0.0.1:8001:8001"

  worker:
    <<: *easyauth-common
    command:
      - "celery"
      - "-A"
      - "easyauth.config.celery:app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    # 覆盖镜像里 curl :8001 的 web healthcheck(worker 不监听该端口)。
    # 进程内 /health 在 broker 连通时返回 200; 探针只做本机 urllib, 不拉起 Celery.
    healthcheck:
      <<: *worker-healthcheck

  webhook-worker:
    <<: *easyauth-common
    user: root
    cap_add:
      - NET_ADMIN
    environment:
      <<: *easyauth-env
      # 本机是 Docker Desktop(macOS): 外部域名被解析进 198.18.0.0/15 NAT 段,
      # 不放行则 worker 全部对外 HTTPS 被防火墙 REJECT。Linux 生产部署勿设。
      EGRESS_ALLOW_DOCKER_DESKTOP_NAT: "1"
    command:
      - "/app/deploy/webhook-worker-entrypoint.sh"
      - "celery"
      - "-A"
      - "easyauth.config.celery:app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
      - "--queues=webhooks"
      - "--hostname=webhooks@%h"
    healthcheck:
      <<: *worker-healthcheck

  # notify 队列专属 worker(钉钉工作通知投递)。出站特征与 webhook-worker 相同
  # (业务面只出公网 443: oapi.dingtalk.com; 另需 redis broker/cache), 复用同一防火墙入口脚本。
  # 与 webhooks 队列同机部署(第 7 篇 §3 发布前检查单)。
  notify-worker:
    <<: *easyauth-common
    user: root
    cap_add:
      - NET_ADMIN
    environment:
      <<: *easyauth-env
      # 同 webhook-worker: Docker Desktop NAT 段放行, Linux 生产勿设。
      EGRESS_ALLOW_DOCKER_DESKTOP_NAT: "1"
    command:
      - "/app/deploy/webhook-worker-entrypoint.sh"
      - "celery"
      - "-A"
      - "easyauth.config.celery:app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
      - "--queues=notify"
      - "--hostname=notify@%h"
    healthcheck:
      <<: *worker-healthcheck

  beat:
    <<: *easyauth-common
    command:
      - "celery"
      - "-A"
      - "easyauth.config.celery:app"
      - "beat"
      - "--loglevel=info"
      # schedule 落 /tmp(容器内必可写), 避免 /app 权限问题; 只跑单实例, 不要 scale。
      - "--schedule=/tmp/celerybeat-schedule"
    # beat 无消费循环, 进程崩溃会让 command 退出并由 restart 拉起, 无需 healthcheck。
    healthcheck:
      disable: true

  stream:
    <<: *easyauth-common
    # 钉钉 Stream 消费进程: 事件先落收件箱再 ACK, 处理经 Celery 派发(broker=redis)。
    # 凭证读 IntegrationSettings(数据库)/环境变量, 未配置时进程快速失败并由 restart 重试,
    # 便于在控制台补配后自动恢复。只跑单实例, 不要 scale(多实例会重复消费同一事件,
    # 虽有 event_id 幂等兜底, 但徒增无谓的重复投递)。
    command: ["python", "manage.py", "run_dingtalk_stream"]
    # 镜像默认 healthcheck 探测 :8001, stream 不监听端口; 进程退出由 restart 拉起。
    healthcheck:
      disable: true

networks:
  easyauth:
